# SPDX-License-Identifier: MIT
# Erebine Agent - NVIDIA GPU Stack
#
# Deploys a EIM GPU node with vLLM native CPU KV cache offloading.
# See internal-docs/configuration/kv-offloading.md for details.
#
# QUICK START:
#   1. Get a join key from your Erebine dashboard:
#      Dashboard -> Infrastructure -> Agents -> Generate Join Key
#
#   2. Create host directories with correct permissions:
#      sudo mkdir -p /data/erebine/models /data/erebine/config /data/erebine/vllm-cache
#      sudo chown -R 5152:5152 /data/erebine
#
#   3. Set environment variables or create a .env file:
#      export EREBINE_AGENT_JOIN_KEY=ejk_your_key_here
#
#   4. Start the agent:
#      sudo -E podman compose -f compose.agent-nvidia.yaml up -d
#
# ENROLLMENT WORKFLOW:
#   - On first start, the agent enrolls using your join key
#   - Enrollment state is persisted to /data/erebine/config
#   - On subsequent restarts, the agent reconnects automatically
#   - You can remove EREBINE_AGENT_JOIN_KEY after successful enrollment
#
# ENVIRONMENT VARIABLES:
#   EREBINE_AGENT_JOIN_KEY                         [REQUIRED] Join key from Erebine dashboard (first run only)
#   EREBINE_AGENT_MAX_CONCURRENT                   Optional ceiling for concurrent requests (auto-configured when not set)
#   EREBINE_AGENT_OVERPROVISION_FACTOR             Safe-to-admit slot factor, at least 1.0 (default: 1.5)
#   EREBINE_AGENT_TENSOR_PARALLEL_SIZE             Tensor parallel size for multi-GPU (default: 1)
#   EREBINE_AGENT_GPU_MEMORY_UTILIZATION           GPU memory utilization fraction (default: agent-managed, 0.95)
#   EREBINE_AGENT_MAX_MODEL_LEN                    Maximum sequence length (default: model default)
#   EREBINE_AGENT_MODEL_CACHE_MAX_SIZE_GB          Local model cache size in GB (default: 100)
#   EREBINE_AGENT_LOG_LEVEL                        Logging level: trace, debug, info, warning, error (default: info)
#   EREBINE_AGENT_VLLM_DISABLE_CUSTOM_ALL_REDUCE   Force disable custom all-reduce (default: "false"; A30/A40/L40 are handled automatically)
#   EREBINE_AGENT_MAX_MODEL_LEN                    Maximum sequence length (default: model default)
#   SHM_SIZE                                        Shared memory size (default: 90g)
#   EREBINE_AGENT_CUDA_TOOLKIT_DIR                 Host CUDA toolkit root (see CUDA COMPILER SUPPLY below)
#   EREBINE_AGENT_CUDA_FETCH_COMPILER              Fetch the CUDA compiler from NVIDIA on start (default: 0)
#
# CUDA COMPILER SUPPLY (NVIDIA images only):
#   This image ships no ptxas and no nvcc. NVIDIA's CUDA Toolkit EULA does not
#   identify either as redistributable, so Erebine cannot publish them. Both
#   are needed to compile GPU kernels at run time, and this image carries NO
#   sm80, sm86 or sm89 cubins -- so AMPERE AND ADA GPUS WILL NOT SERVE without
#   a compiler. Blackwell and Hopper have precompiled kernels and do serve.
#
#   Supply one by either route; the choice is yours:
#
#     1. MOUNTED. A CUDA toolkit already on the host, bind-mounted read-only.
#        Nothing is downloaded. Found automatically at /usr/local/cuda,
#        /usr/local/cuda-*, or /opt/cuda; name another location with
#        EREBINE_AGENT_CUDA_TOOLKIT_DIR. Add to this service:
#            volumes:
#              - /usr/local/cuda:/usr/local/cuda:ro
#
#     2. FETCHED. Downloaded from NVIDIA on first start, verified against
#        NVIDIA's published sha256 and cached for later starts. Off by
#        default: a container that reaches the internet on boot should be
#        asked to, not assume it. Add to this service:
#            environment:
#              EREBINE_AGENT_CUDA_FETCH_COMPILER: "1"
#
#   With neither, the agent still starts and still serves -- it warns once and
#   names both routes. `erectl deploy agent eim` performs route 1 for you
#   when the host has a toolkit, which is why an erectl-managed host needs
#   nothing here.
#
# KERNEL SOCKET BUFFER TUNING (optional):
#   The agent sets ZeroMQ socket buffers to 4 MiB for streaming throughput.
#   Linux defaults net.core.wmem_max and net.core.rmem_max to 212992 bytes,
#   which silently caps the requested buffer size. The agent will attempt to
#   raise these limits on startup, which works only for a privileged
#   container on the HOST network (/proc/sys is read-only in every
#   unprivileged container, and the knobs do not exist in a bridge
#   network namespace at all -- CAP_SYS_ADMIN alone does not help).
#
#   If the container is not privileged, set these on the host before starting:
#     sudo sysctl -w net.core.wmem_max=4194304
#     sudo sysctl -w net.core.rmem_max=4194304
#
#   To persist across reboots, add to /etc/sysctl.d/99-erebine.conf:
#     net.core.wmem_max = 4194304
#     net.core.rmem_max = 4194304

services:
  agent:
    image: ${DOCKER_REGISTRY:-ghcr.io/erebine/container-agents}/eim-vllm-cuda:${VERSION:-latest}
    container_name: eim-vllm-cuda
    network_mode: host
    ipc: host
    privileged: true
    shm_size: ${SHM_SIZE:-90g}
    # Podman defaults a container to 2048 pids and counts threads; vLLM needs more.
    pids_limit: -1
    # For Docker Compose v2.3+ with NVIDIA Container Toolkit, use the following deploy section to request GPUs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    volumes:
      # Persistent model cache
      - /data/erebine/models:/var/lib/inference/.cache/erebine/models
      # Persistent vLLM compile/JIT cache (VLLM_CACHE_ROOT) -- avoids repaying warmup on restart
      - /data/erebine/vllm-cache:/var/lib/inference/.cache/erebine/vllm
      # Persistent enrollment state
      - /data/erebine/config:/var/lib/inference/.config/erebine
      # LMCache disk tier (EREBINE_AGENT_KV_CACHE_BACKEND=lmcache). Mount a
      # dedicated disk here so the cache never competes with the model store;
      # the node sizes the tier from the volume at each launch.
      # - /data/erebine/lmcache:/var/lib/inference/.cache/erebine/lmcache
    environment:
      # Agent Enrollment [REQUIRED for first run]
      EREBINE_AGENT_JOIN_KEY: "${EREBINE_AGENT_JOIN_KEY:-}"
      # KV cache backend: native (default) | lmcache | none. See /docs/eim/advanced#lmcache
      EREBINE_AGENT_KV_CACHE_BACKEND: "${EREBINE_AGENT_KV_CACHE_BACKEND:-native}"
      # Optional explicit LMCache disk tier capacity in GiB; unset = derived from the volume
      EREBINE_AGENT_LMCACHE_DISK_SIZE_GB: "${EREBINE_AGENT_LMCACHE_DISK_SIZE_GB:-}"
      # Model is assigned from the dashboard during enrollment
      EREBINE_AGENT_LOG_LEVEL: "${EREBINE_AGENT_LOG_LEVEL:-info}"
      # Off by default: the node disables custom all-reduce itself on A30/A40/L40, and after a CUDA-graph fault.
      EREBINE_AGENT_VLLM_DISABLE_CUSTOM_ALL_REDUCE: "${EREBINE_AGENT_VLLM_DISABLE_CUSTOM_ALL_REDUCE:-false}"
    restart: unless-stopped
