# SPDX-License-Identifier: MIT
# Erebine Agent - EEM Execution Stack
#
# Deploys a single EEM (Execution Management) agent that enrolls
# with an already-running Erebine router and dispatches
# infrastructure tool calls. Unlike the EIM inference agents this
# stack does not bundle a GPU or vLLM runtime -- the EEM agent is a
# lightweight text-only dispatcher.
#
# QUICK START:
#   `erectl deploy agent eem` runs every step below -- directories,
#   compose stack, join key, start and verification -- on one host. The
#   manual recipe is here for hosts that erectl cannot reach.
#
#   1. Get a join key from your Erebine dashboard:
#      Agents -> Execution (EEM) -> Enroll an EEM agent. The tab the
#      button sits on supplies the execution role; there is no
#      capability selector to set.
#
#   2. Set your join key and router URL:
#      export EREBINE_AGENT_JOIN_KEY=ejk_your_key_here
#      export EREBINE_ROUTER_URL=https://router.example.com
#
#   3. Create host directories with correct permissions:
#      sudo mkdir -p /data/erebine-eem/{credentials,state,config}
#      sudo chown -R 5153:5153 /data/erebine-eem
#
#   4. Start the agent:
#      docker compose -f compose/compose.agent-eem.yaml up -d
#
# ENVIRONMENT VARIABLES:
#   EREBINE_AGENT_JOIN_KEY    [REQUIRED] Join key from Erebine dashboard
#   EREBINE_ROUTER_URL        [REQUIRED] HTTPS enrollment URL of the router
#   EREBINE_AGENT_REGISTRATION_NAME
#                              [REQUIRED] Unique per-project name for this agent
#                              (kebab-case or alphanumeric, max 48 chars)
#   EEM_IMAGE                  Container image name
#                              (default: ghcr.io/erebine/container-agents/eem:latest)
#   EEM_AGENT_LOG_LEVEL        Logging level: trace, debug, info, warning,
#                              error, critical (default: info)
#   EEM_AGENT_MAX_CONCURRENT   Max concurrent tool executions (default: 20)
#
# ENROLLMENT WORKFLOW:
#   - On first start the agent enrolls against the configured router
#   - The agent generates a persistent Ed25519 signing key on first run
#     and writes it to /var/lib/eem/.config/erebine/agent-signing-key.hex
#     (mode 0600) so CURVE rotation acks survive restart.
#   - The Curve25519 CURVE key lands next to it at
#     /var/lib/eem/.config/erebine/agent-curve-key.hex, inside the same
#     persisted config volume.
#   - The enrollment itself is recorded at
#     /var/lib/eem/.config/erebine/agent-enrollment.json and restored on
#     every later start, so the join key is presented exactly once and
#     can be revoked as soon as the first start succeeds. Remove that
#     file to enroll again, which needs a fresh key.
#   - A key carries a fixed number of enrollment slots; the agents
#     dashboard mints keys with one. A returning agent presenting its
#     enrolled CURVE key claims no further slot, but one that comes back
#     with a NEW CURVE key is a new machine and needs one -- so an agent
#     that lost its config volume 401s against a spent key. Keep the
#     volume, or mint a fresh key.
#   - Subsequent restarts reuse the signing key; the router verifies
#     rotation acks against the enrolled public key.

services:
  eem-agent:
    image: ${EEM_IMAGE:-ghcr.io/erebine/container-agents/eem:latest}
    container_name: erebine-eem-agent
    # Container output goes to the journal on both runtimes: rootful
    # podman on EL9 defaults to journald already, docker defaults to
    # json-file and needs the pin. Entries carry the container name
    # (journalctl -t erebine-eem-agent on podman; CONTAINER_NAME=
    # erebine-eem-agent match on docker).
    logging:
      driver: journald
    restart: unless-stopped
    environment:
      # Every key below is spelled the way the agent's loader reads it
      # first. The loader still answers to the historical bare EEM_*
      # names, and this stack writes none of them.
      #
      # Enrollment [REQUIRED for first run]
      EREBINE_AGENT_JOIN_KEY: ${EREBINE_AGENT_JOIN_KEY:?EREBINE_AGENT_JOIN_KEY is required}
      EREBINE_EEM_ROUTER_URL: ${EREBINE_ROUTER_URL:?EREBINE_ROUTER_URL is required}
      EREBINE_EEM_REGISTRATION_NAME: ${EREBINE_AGENT_REGISTRATION_NAME:?EREBINE_AGENT_REGISTRATION_NAME is required}
      # External id of the project the join key is bound to. Unset
      # disables deep_think and the execution-memory / artifact /
      # subplan primitives (router callbacks).
      EREBINE_EEM_PROJECT_EXTERNAL_ID: ${EREBINE_EEM_PROJECT_EXTERNAL_ID:-}
      # Agent configuration (defaulted by image; override as needed)
      EREBINE_EEM_LOG_LEVEL: ${EEM_AGENT_LOG_LEVEL:-info}
      EREBINE_EEM_MAX_CONCURRENT_EXECUTIONS: ${EEM_AGENT_MAX_CONCURRENT:-20}
      EREBINE_EEM_CREDENTIALS_DIR: /var/lib/erebine/credentials
      EREBINE_EEM_SIGNING_KEY_PATH: /var/lib/eem/.config/erebine/agent-signing-key.hex
      EREBINE_EEM_CURVE_KEY_PATH: /var/lib/eem/.config/erebine/agent-curve-key.hex
      # Operator-declared workspaces. The agent's own default is
      # /etc/erebine/workspaces.yaml, which this stack does not mount;
      # pinning it here means the file lands in the config volume below,
      # where `erectl workspaces declare` writes it.
      EREBINE_EEM_WORKSPACES_FILE: /var/lib/eem/.config/erebine/workspaces.yaml
    volumes:
      # Workspace credentials (operator-managed)
      - /data/erebine-eem/credentials:/var/lib/erebine/credentials:ro
      # Runtime state (leases, queues, offline fail-safe)
      - /data/erebine-eem/state:/var/lib/erebine/state
      # Persistent signing key + enrollment state
      - /data/erebine-eem/config:/var/lib/eem/.config/erebine

networks: {}
